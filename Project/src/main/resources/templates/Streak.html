<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Streak with Mystery Box</title>

    <!-- Bootstrap & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>/* General Styling */
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    /* Form Container */
    .login-container {
        background: rgba(255, 255, 255, 0.95);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 100%;
        max-width: 450px;
        animation: fadeIn 1s ease-in-out;
    }

    /* Bootstrap-Inspired Buttons */
    .btn-lg {
        font-size: 18px;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 8px;
        transition: all 0.3s ease-in-out;
        margin-top: 10px;
        width: 100%;
    }

    .btn-primary {
        background-color: #2575fc;
        border: none;
    }

    .btn-primary:hover {
        background-color: #1a5bbf;
        transform: translateY(-2px);
    }

    .btn-success {
        background-color: #28a745;
        border: none;
    }

    .btn-success:hover {
        background-color: #1e7e34;
        transform: translateY(-2px);
    }

    /* 3D Mystery Box Popup */
    .popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        width: 220px;
        height: 220px;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 15px;
        transition: transform 0.5s ease-in-out;
    }

    .popup.open {
        transform: translate(-50%, -50%) scale(1);
    }

    .popup.hidden {
        display: none;
    }

    /* Mystery Box */
    .box {
        position: relative;
        width: 140px;
        height: 140px;
        background: linear-gradient(135deg, #ffcc00, #ff6600);
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        display: flex;
        justify-content: center;
        align-items: center;
        animation: bounce 1s infinite;
    }

    /* Box Lid */
    .box-lid {
        position: absolute;
        width: 140px;
        height: 20px;
        background: #ff3300;
        top: -10px;
        border-radius: 5px;
        transition: transform 0.5s ease-in-out;
    }

    /* Box opens */
    .popup.open .box-lid {
        transform: translateY(-30px);
    }

    /* Box Reward Message */
    .reward-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 20px;
        font-weight: bold;
        color: white;
        text-align: center;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
    }

    /* Reveal the reward when box is opened */
    .popup.open .reward-message {
        opacity: 1;
    }

    /* Animations */
    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-5px);
        }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Your Current Streak: <span id="streak-count">0</span> days</h2>
    <button class="btn btn-primary btn-lg" onclick="updateStreak()">✅ Complete Activity</button>

    <h3>Mystery Box Status: <span id="mystery-box-status">No Box Available</span></h3>
    <button class="btn btn-success btn-lg" onclick="claimMysteryBox()" id="claim-btn" disabled>🎁 Claim Mystery Box</button>
</div>

<!-- 3D Mystery Box Popup -->
<div id="mystery-box-popup" class="popup hidden">
    <div class="box">
        <div class="box-lid"></div>
        <div class="box-container"></div>
        <div class="reward-message" id="reward-message">🎉 You Won: ???</div>
    </div>
</div>

<script>
    const userId = 1; // Change this based on logged-in user

    async function fetchStreak() {
        const response = await fetch(`http://localhost:8080/api/streaks/${userId}`);
        const data = await response.json();
        document.getElementById("streak-count").innerText = data.streakCount;

        if (data.mysteryBoxAvailable) {
            document.getElementById("mystery-box-status").innerText = "Mystery Box Ready!";
            document.getElementById("claim-btn").disabled = false;
        } else {
            document.getElementById("mystery-box-status").innerText = "No Box Available";
            document.getElementById("claim-btn").disabled = true;
        }
    }

    async function updateStreak() {
        await fetch(`http://localhost:8080/api/streaks/${userId}`, { method: "POST" });
        fetchStreak();
    }

    async function claimMysteryBox() {
        const response = await fetch(`http://localhost:8080/api/streaks/${userId}/mystery-box`);
        const message = await response.text();

        document.getElementById("reward-message").innerText = message;
        showMysteryBox();
        fetchStreak();
    }

    function showMysteryBox() {
        const popup = document.getElementById("mystery-box-popup");
        popup.classList.remove("hidden");
        setTimeout(() => {
            popup.classList.add("open");
        }, 100);

        // Hide popup after a few seconds
        setTimeout(() => {
            popup.classList.remove("open");
            popup.classList.add("hidden");
        }, 3000);
    }

    fetchStreak();
</script>

</body>
</html>
