<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Title of the page -->
  <title>Edit Goal</title>

  <!-- Link to the external CSS file for styling -->
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 0;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      height: 100vh;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      padding: 20px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      position: fixed;
      top: 0;
      left: 0;
    }

    .sidebar h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      font-family: 'Poppins', sans-serif;
      color: white;
    }

    .sidebar .nav-link {
      color: black;
      padding: 10px 15px;
      margin: 5px 0;
      border-radius: 5px;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      font-weight: 600; /* Same font weight as the dashboard title */
    }

    .sidebar .nav-link:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(10px);
    }

    .goal-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 100%;
      max-width: 600px;
      animation: fadeIn 1s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden; /* Prevents content from overflowing */
      flex-grow: 1; /* Allows it to grow when new content is added */
      min-height: 400px; /* Ensures the container doesn't shrink too small */
      margin-left: 250px; /* Space for sidebar */
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>Goals Tracker</h2>
  <ul class="nav flex-column">
    <li class="nav-item"><a href="/dashboard" class="nav-link">Dashboard</a></li>
    <li class="nav-item"><a href="/logout" class="nav-link">Logout</a></li>
  </ul>
</div>

<!-- White background container for the "Edit Goal" page -->
<div class="goal-container">
  <h1>Edit Goal</h1>

  <!-- Button to navigate back to the goals page -->
  <button onclick="window.location.href='/goals'" class="btn top-button">Back to Goals</button>

  <!-- Form for editing an existing goal -->
  <form th:action="@{/goals/{id}/edit(id=${goal.id})}" method="post" onsubmit="return validateForm()">
    <!-- Label and input for goal title -->
    <label>Goal Title:</label>
    <input type="text" name="title" id="goalTitle" th:value="${goal.title}" required pattern=".*\S.*" title="Title cannot be empty or whitespace" maxlength="50">
    <!-- The title input is pre-filled with the current goal title using Thymeleaf (th:value="${goal.title}") -->

    <!-- Label and input for goal duration in days -->
    <label>Days:</label>
    <input type="number" name="days" th:value="${days}" min="0" required>
    <!-- Pre-filled with the existing "days" value using Thymeleaf (th:value="${days}") -->

    <!-- Label and input for goal duration in hours -->
    <label>Hours:</label>
    <input type="number" name="hours" th:value="${hours}" min="0" required>
    <!-- Pre-filled with the existing "hours" value using Thymeleaf (th:value="${hours}") -->

    <!-- Label and input for goal duration in minutes -->
    <label>Minutes:</label>
    <input type="number" name="minutes" th:value="${minutes}" min="0" required>
    <!-- Pre-filled with the existing "minutes" value using Thymeleaf (th:value="${minutes}") -->

    <!-- Submit button to update the goal -->
    <button type="submit" class="btn bottom-button">Update Goal</button>
  </form>

  <!-- JavaScript function to validate the form -->
  <script>
    // Function that runs when the form is submitted
    function validateForm() {
      // Get the value of the goal title input field and trim any leading/trailing spaces
      let titleInput = document.getElementById("goalTitle").value.trim();

      // If the title is empty or contains only spaces, display an alert and prevent form submission
      if (titleInput.length === 0) {
        alert("Goal title cannot be empty or whitespace.");
        return false;  // Prevent form submission
      }
      return true;  // Allow form submission if the title is valid
    }
  </script>
</div>

</body>
</html>
