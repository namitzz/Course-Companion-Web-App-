<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Goal</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- White background container -->
<div class="goal-container">
  <h1>Edit Goal</h1>

  <!-- Back Button -->
  <button onclick="window.location.href='/goals'" class="btn">Back to Goals</button>

  <!-- Update form action to use the goal's ID in the URL -->
  <form th:action="@{/goals/{id}/edit(id=${goal.id})}" method="post">
    <label>Goal Title:</label>
    <input type="text" name="title" th:value="${goal.title}" required>

    <label>Days:</label>
    <input type="number" name="days" th:value="${goal.days}" min="0" required>

    <label>Hours:</label>
    <input type="number" name="hours" th:value="${goal.hours}" min="0" required>

    <label>Minutes:</label>
    <input type="number" name="minutes" th:value="${goal.minutes}" min="0" required>

    <button type="submit">Update Goal</button>
  </form>
</div>

</body>
</html>
