<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Flashcards</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>Create New Flashcard</h1>

<form id="flashcardForm">
    <input type="text" id="question" placeholder="Enter question" required>
    <input type="text" id="answer" placeholder="Enter answer" required>
    <button type="submit">Add Flashcard</button>
</form>

<h2>Current Flashcards</h2>
<ul id="flashcardList"></ul>

<!-- Navigation Buttons -->
<div class="navigation-buttons" style="text-align: center; margin-top: 30px;">
    <a href="/index.html">
        <button>Back to Home</button>
    </a>
    <a href="/play.html">
        <button style="margin-left: 10px;">Go to Play Game</button>
    </a>
</div>

<script>
    async function loadFlashcards() {
        const res = await fetch('/api/flashcards');
        const flashcards = await res.json();

        const list = document.getElementById('flashcardList');
        list.innerHTML = ''; // Clear existing list

        flashcards.forEach(card => {
            const li = document.createElement('li');
            li.innerHTML = `
                    <strong>Q:</strong> ${card.question}<br>
                    <strong>A:</strong> ${card.answer}<br>
                    <button onclick="removeFlashcard(${card.id})">Remove</button>
                `;
            list.appendChild(li);
        });
    }

    async function removeFlashcard(id) {
        const confirmed = confirm("Are you sure you want to remove this flashcard?");
        if (confirmed) {
            await fetch(`/api/flashcards/${id}`, { method: 'DELETE' });
            loadFlashcards();
        }
    }

    document.getElementById('flashcardForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const question = document.getElementById('question').value.trim();
        const answer = document.getElementById('answer').value.trim();

        if (!question || !answer) return;

        await fetch('/api/flashcards', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, answer })
        });

        document.getElementById('flashcardForm').reset();
        loadFlashcards();
    });

    loadFlashcards(); // Load on page load
</script>
</body>
</html>
