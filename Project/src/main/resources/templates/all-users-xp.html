<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users' XP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            color: #f1f5f9;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5rem;
            color: #38bdf8;
        }
        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        th, td {
            padding: 15px;
            text-align: center;
        }
        th {
            background-color: #1e293b;
            color: #38bdf8;
            font-size: 1.2rem;
        }
        td {
            background-color: #0f172a;
            font-size: 1rem;
            color: #f1f5f9;
        }
        tr:nth-child(even) td {
            background-color: #1e293b;
        }
        tr:hover td {
            background-color: #334155;
            cursor: pointer;
        }
        .xp-bar {
            background-color: #334155;
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
            width: 80%;
            margin: 0 auto;
        }
        .xp-fill {
            height: 100%;
            background-color: #38bdf8;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
<h1>All Users' XP</h1>
<table>
    <thead>
    <tr>
        <th>User ID</th>
        <th>Username</th>
        <th>Experience Points (XP)</th>
        <th>XP Progress</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">1</td>
        <td th:text="${user.username}">JohnDoe</td>
        <td th:text="${user.xp}">150 XP</td>
        <td>
            <div class="xp-bar">
                <div class="xp-fill" th:style="|width: ${user.xp != null ? user.xp % 100 : 0};|"></div>
            </div>
            <p th:text="${user.xp + 'XP'}" style="text-align: center; margin-top: 5px;"></p>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
