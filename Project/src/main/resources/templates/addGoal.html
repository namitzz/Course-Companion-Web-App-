<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Title of the page -->
  <title>Add Goal</title>

  <!-- Link to the external CSS file for styling -->
  <link rel="stylesheet" th:href="@{/css/styles.css}">

  <script>
    // JavaScript function to set the goal title based on the dropdown selection
    function setGoalTitle() {
      // Get the dropdown and input field elements
      let dropdown = document.getElementById("defaultGoals");
      let customInput = document.getElementById("goalTitle");

      // If the selected value is not 'custom', set the input field to the dropdown value and disable it
      if (dropdown.value !== "custom") {
        customInput.value = dropdown.value;
        customInput.readOnly = true; // Prevent manual changes when selecting a default goal
      } else {
        // If 'custom' is selected, reset the input field and enable manual input
        customInput.value = "";
        customInput.readOnly = false;
      }
    }
  </script>
</head>
<body>

<!-- Main container for the Add Goal page -->
<div class="goal-container">
  <h1>Add a New Goal</h1>

  <!-- Button to navigate back to the goals page -->
  <button onclick="window.location.href='/goals'" class="btn top-button">Back to Goals</button>

  <!-- Form for creating a new goal -->
  <form th:action="@{/goals/add}" method="post">

    <!-- Dropdown for selecting a predefined goal -->
    <label>Select a Goal:</label>
    <select id="defaultGoals" onchange="setGoalTitle()">
      <!-- Option for custom goal input -->
      <option value="custom">-- Choose a Goal or Enter Your Own --</option>
      <!-- Default goal options -->
      <option value="Complete 1 IBM SkillsBuild Course">Complete 1 IBM SkillsBuild Course</option>
      <option value="Complete 3 IBM SkillsBuild Courses">Complete 3 IBM SkillsBuild Courses</option>
      <option value="Complete 5 IBM SkillsBuild Courses">Complete 5 IBM SkillsBuild Courses</option>
      <option value="Earn an IBM SkillsBuild Certificate">Earn an IBM SkillsBuild Certificate</option>
      <option value="Complete a Career Path in IBM SkillsBuild">Complete a Career Path in IBM SkillsBuild</option>
    </select>

    <!-- Input for custom goal title -->
    <label>Goal Title:</label>
    <input type="text" name="title" id="goalTitle" required pattern=".*\S.*" title="Title cannot be empty or whitespace">
    <!-- The input is required and cannot contain only whitespace -->

    <!-- Input fields for the goal duration -->
    <label>Days:</label>
    <input type="number" name="days" min="0" required> <!-- Duration in days, must be a non-negative number -->

    <label>Hours:</label>
    <input type="number" name="hours" min="0" required> <!-- Duration in hours, must be a non-negative number -->

    <label>Minutes:</label>
    <input type="number" name="minutes" min="0" required> <!-- Duration in minutes, must be a non-negative number -->

    <!-- Submit button to create the goal -->
    <button type="submit" class="btn bottom-button">Create Goal</button>
  </form>
</div>

</body>
</html>
