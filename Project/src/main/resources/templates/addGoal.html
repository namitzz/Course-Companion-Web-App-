<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Goal</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- White background container -->
<div class="goal-container">
  <h1>Add a New Goal</h1>

  <!-- Back Button -->
  <button onclick="window.location.href='/goals'" class="btn">Back to Goals</button>

  <form th:action="@{/goals/add}" method="post">
    <label>Goal Title:</label>
    <input type="text" name="title" required>

    <label>Days:</label>
    <input type="number" name="days" min="0" required>

    <label>Hours:</label>
    <input type="number" name="hours" min="0" required>

    <label>Minutes:</label>
    <input type="number" name="minutes" min="0" required>

    <button type="submit">Create Goal</button>
  </form>
</div>

</body>
</html>
