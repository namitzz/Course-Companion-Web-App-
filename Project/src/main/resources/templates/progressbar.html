<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>

    <!-- Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 20px; text-align: center; }
        .progress-container { max-width: 500px; margin: auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); }
        .progress { height: 20px; }
    </style>
</head>
<body>

<h2>Course Progress</h2>

<div class="progress-container p-4">
    <div th:each="course : ${courses}" class="mb-3">
        <p><strong th:text="${course.courseName}"></strong></p>
        <div class="progress">
            <div class="progress-bar" role="progressbar"
                 th:style="'width:' + ${course.progressPercentage} + '%'"
                 th:aria-valuenow="${course.progressPercentage}"
                 aria-valuemin="0" aria-valuemax="100"
                 th:text="${course.progressPercentage} + '%'">
            </div>
        </div>
    </div>
</div>

</body>
</html>
