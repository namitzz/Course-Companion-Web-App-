<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Stats</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* General Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: #2575fc;
        }

        .stats-container {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .stats-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .stats-container p {
            font-size: 16px;
        }

        .stats-container p strong {
            color: #2575fc;
        }

        ul.top-courses {
            list-style-type: none;
            padding-left: 0;
        }

        ul.top-courses li {
            background-color: #e9ecef;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        canvas {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Course Statistics</h1>

    <!-- General Stats Section -->
    <div class="stats-container">
        <h2>Overview</h2>
        <p><strong>Completed Courses:</strong> <span id="completed" th:text="${completedCourses}"></span></p>
        <p><strong>Total Time Spent:</strong> <span id="studyTime" th:text="${totalTimeSpent}"></span> minutes</p>
        <p><strong>Active Courses:</strong> <span id="active" th:text="${activeCourses}"></span></p>
    </div>

    <!-- Top Courses Section -->
    <div class="stats-container">
        <h2>Top 3 Most Popular Courses</h2>
        <ul class="top-courses">
            <li th:each="course : ${top3Courses}" th:text="${course}"></li>
        </ul>
    </div>

    <!-- Chart Section -->
    <div class="stats-container">
        <h2>Course Distribution</h2>
        <canvas id="courseChart"></canvas>
    </div>
</div>

<!-- Chart.js Script -->
<script>

    const completedCourses = parseInt(document.getElementById("completed")?.innerText || "0");
    const activeCourses = parseInt(document.getElementById("active")?.innerText || "0");


    if (isNaN(completedCourses) || isNaN(activeCourses)) {
        console.error("Invalid data for chart rendering: Completed Courses or Active Courses is NaN.");
    } else {

        const ctx = document.getElementById('courseChart').getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['Completed Courses', 'Active Courses'],
                datasets: [{
                    data: [completedCourses, activeCourses],
                    backgroundColor: ['#4CAF50', '#FF9800'],
                    borderColor: ['#388E3C', '#F57C00'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' },
                    tooltip: {
                        callbacks: {
                            label(context) {
                                let label = context.label || '';
                                if (label) { label += ': '; }
                                label += context.raw + ' courses';
                                return label;
                            }
                        }
                    }
                },
                animation: {
                    duration: 1000,
                    easing: 'easeInOutQuad'
                }
            }
        });
    }
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
