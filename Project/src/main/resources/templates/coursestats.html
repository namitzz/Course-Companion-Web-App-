<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Stats</title>

    <!-- Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js for graphical representation -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Poppins font for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* General Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 20px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-in-out;
        }

        h2 {
            font-size: 28px;
            font-weight: 600;
            color: #2575fc;
            margin-bottom: 20px;
            text-align: center;
            animation: slideDown 0.5s ease-in-out;
        }

        .stats-container {
            padding: 20px;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .stats-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .stats-container p {
            font-size: 16px;
            color: #333;
            margin: 10px 0;
        }

        .stats-container p strong {
            color: #2575fc;
        }

        canvas {
            margin-top: 20px;
            animation: fadeIn 1s ease-in-out;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Course Stats</h2>
<center><div class="stats-container">
        <p><strong>Completed Courses:</strong> <span id="completed" th:text="${completedCourses}"></span></p>
        <p><strong>Active Courses:</strong> <span id="active" th:text="${activeCourses}"></span></p>
        <p><strong>Total Study Time:</strong> <span id="studyTime" th:text="${totalTimeSpent}"></span> minutes</p>

        <!-- Pie Chart -->
        <canvas id="courseChart"></canvas>
    </div></center>

</div>

<script>
    // Fetching stats from Thymeleaf variables
    const completedCourses = parseInt(document.getElementById("completed").innerText);
    const activeCourses = parseInt(document.getElementById("active").innerText);
    const totalTimeSpent = parseInt(document.getElementById("studyTime").innerText);

    // Creating a Chart.js pie chart
    const ctx = document.getElementById('courseChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Completed Courses', 'Active Courses'],
            datasets: [{
                data: [completedCourses, activeCourses],
                backgroundColor: ['#4CAF50', '#FF9800'],
                borderColor: ['#388E3C', '#F57C00'],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let label = context.label || '';
                            if (label) {
                                label += ': ';
                            }
                            label += context.raw + ' courses';
                            return label;
                        }
                    }
                }
            },
            animation: {
                duration: 1000,
                easing: 'easeInOutQuad'
            }
        }
    });
</script>

</body>
</html>
