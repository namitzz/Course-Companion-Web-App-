<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course</title>
    <link rel="stylesheet" th:href="@{/static/css/styles.css}">
    <!-- Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Poppins font for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* General Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            margin: 0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 20px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #2575fc;
            margin-bottom: 20px;
            text-align: center;
            animation: slideDown 0.5s ease-in-out;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }

        input[type="text"],
        input[type="number"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #2575fc;
            box-shadow: 0 0 8px rgba(37, 117, 252, 0.3);
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn.update {
            background: #2575fc;
            color: white;
        }

        .btn.update:hover {
            background: #1a5bbf;
            transform: translateY(-2px);
        }

        .btn.home {
            background: #6c757d;
            color: white;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 20px;
        }

        .btn.home:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Edit Course</h1>

    <form th:action="@{/courses/update}" method="post" class="form-container">
        <input type="hidden" name="id" th:value="${courseTracker.id}">

        <label for="name">Course Name:</label>
        <input type="text" id="name" name="name" th:value="${courseTracker.name}" required>

        <label for="weight">Weight (%):</label>
        <input type="number" id="weight" name="weight" min="1" max="100" th:value="${courseTracker.weight}" required>

        <button type="submit" class="btn update">Update Course</button>
    </form>

    <a href="/courses" class="btn home">Back to Courses</a>
</div>

</body>
</html>>
