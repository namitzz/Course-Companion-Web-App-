<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Manager</title>
    <!-- Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Poppins font for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* General Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 20px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-in-out;
        }

        h1, h2 {
            color: #2575fc;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        h2 {
            font-size: 24px;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }

        input[type="text"],
        input[type="number"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #2575fc;
            box-shadow: 0 0 8px rgba(37, 117, 252, 0.3);
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn.add {
            background: #28a745;
            color: white;
        }

        .btn.add:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn.edit {
            background: #ffc107;
            color: white;
        }

        .btn.edit:hover {
            background: #e0a800;
            transform: translateY(-2px);
        }

        .btn.delete {
            background: #dc3545;
            color: white;
        }

        .btn.delete:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn.home {
            background: #6c757d;
            color: white;
            display: block;
            margin-top: 20px;
            text-align: center;
        }

        .btn.home:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #2575fc;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .inline-form {
            display: inline;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Course Manager</h1>

    <!-- Add Course Form -->
    <h2>Add a New Course</h2>
    <form action="/courses/add" method="post" class="form-container">
        <label for="name">Course Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter course name">

        <label for="weight">Weight (%):</label>
        <input type="number" id="weight" name="weight" min="1" max="100" required placeholder="Enter percentage">

        <button type="submit" class="btn add">Add Course</button>
    </form>

    <!-- Course List -->
    <h2>Existing Courses</h2>
    <table>
        <thead>
        <tr>
            <th>Course Name</th>
            <th>Weight (%)</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="courseTracker : ${courses}">
            <td th:text="${courseTracker.name}"></td>
            <td th:text="${courseTracker.weight}"></td>
            <td>
                <!-- Edit Button -->
                <a th:href="@{/courses/edit/{id}(id=${courseTracker.id})}" class="btn edit">Edit</a>

                <!-- Delete Button -->
                <form th:action="@{/courses/delete/{id}(id=${courseTracker.id})}" method="post" class="inline-form">
                    <button type="submit" class="btn delete">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/" class="btn home">Back to Home</a>
</div>

<!-- Include Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
