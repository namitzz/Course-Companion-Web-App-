<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #333;
      margin: 0;
      padding: 60px 0;
    }

    .profile-container {
      background: #fff;
      padding: 40px 50px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 960px;
      margin: auto;
      animation: fadeIn 0.8s ease-in-out;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 40px;
    }

    .profile-image {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }

    .profile-header h2 {
      margin: 0;
      font-size: 28px;
      color: #2575fc;
      font-weight: 600;
    }

    .profile-header p {
      margin: 5px 0 0;
      font-size: 16px;
      color: #555;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 30px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      color: #333;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background-color: #f9f9f9;
      transition: border-color 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #2575fc;
      box-shadow: 0 0 6px rgba(37, 117, 252, 0.3);
      outline: none;
      background: #fff;
    }

    textarea {
      resize: vertical;
    }

    .full-width {
      grid-column: span 2;
    }

    .button-group {
      grid-column: span 2;
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      margin-top: 10px;
    }

    button, .btn {
      padding: 12px 28px;
      background: #2575fc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      text-decoration: none;
    }

    button:hover, .btn:hover {
      background: #1a5bbf;
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .profile-container {
        padding: 30px;
      }

      .profile-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      form {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: span 1;
      }

      .button-group {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
<div class="profile-container">
  <div class="profile-header">
    <img th:src="${user.profileImagePath}" alt="Profile Image" class="profile-image" onerror="this.src='/images/default-profile.png'">
    <div>
      <h2 th:text="${user.username}">Your Name</h2>
      <p th:text="${user.bio}">Short bio goes here</p>
    </div>
  </div>

  <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data">
    <div class="full-width">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" th:value="${user.username}" required>
    </div>

    <div class="full-width">
      <label for="bio">Bio:</label>
      <textarea id="bio" name="bio" rows="3" th:text="${user.bio}" required></textarea>
    </div>

    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" th:value="${user.email}" required>
    </div>

    <div>
      <label for="pronouns">Pronouns:</label>
      <input type="text" id="pronouns" name="pronouns" th:value="${user.pronouns}" required>
    </div>

    <div>
      <label for="address">Address:</label>
      <input type="text" id="address" name="address" th:value="${user.address}" required>
    </div>

    <div>
      <label for="gender">Gender:</label>
      <select id="gender" name="gender" required>
        <option value="Male" th:selected="${user.gender == 'Male'}">Male</option>
        <option value="Female" th:selected="${user.gender == 'Female'}">Female</option>
        <option value="Other" th:selected="${user.gender == 'Other'}">Other</option>
      </select>
    </div>

    <div class="full-width">
      <label for="profileImage">Profile Image:</label>
      <input type="file" id="profileImage" name="profileImage" accept="image/*">
    </div>

    <div class="button-group">
      <button type="submit">Update</button>
      <a href="/dashboard" class="btn">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
