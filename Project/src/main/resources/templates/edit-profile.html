<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* General Styling */
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Profile Container */
    .profile-container {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 100%;
      max-width: 400px;
      animation: fadeIn 1s ease-in-out;
    }

    /* Profile Image */
    .profile-image {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* Headings */
    h2 {
      color: #2575fc;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
      font-size: 24px;
    }

    label {
      font-size: 16px;
      font-weight: 500;
      color: #333;
      text-align: left;
      display: block;
      margin-top: 10px;
    }

    /* Input Fields */
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ddd;
      background: white;
      color: black;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
      transition: all 0.3s ease-in-out;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #2575fc;
      box-shadow: 0 0 8px rgba(37, 117, 252, 0.3);
    }

    /* Button Styling */
    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }

    button, .btn {
      padding: 12px 24px;
      background: #2575fc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      flex: 1;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    button:hover, .btn:hover {
      background: #1a5bbf;
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
<div class="profile-container">
  <img th:src="${user.profileImagePath}" alt="Profile Image" class="profile-image" onerror="this.src='/images/default-profile.png'">
  <h2 th:text="${user.username}"></h2>
  <p th:text="${user.bio}"></p>

  <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" th:value="${user.username}" required>

    <label for="bio">Bio:</label>
    <textarea id="bio" name="bio" rows="3" th:text="${user.bio}" required></textarea>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" th:value="${user.email}" required>

    <label for="pronouns">Pronouns:</label>
    <input type="text" id="pronouns" name="pronouns" th:value="${user.pronouns}" required>

    <label for="address">Address:</label>
    <input type="text" id="address" name="address" th:value="${user.address}" required>

    <label for="gender">Gender:</label>
    <select id="gender" name="gender" required>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label for="profileImage">Profile Image:</label>
    <input type="file" id="profileImage" name="profileImage" accept="image/*">

    <div class="button-group">
      <button type="submit">Update</button>
      <a href="/dashboard" class="btn">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
