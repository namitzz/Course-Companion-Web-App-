<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">
  <div class="profile-header">
    <img th:src="${user.profileImagePath}" alt="Profile Image" class="profile-image" onerror="this.src='/images/default-profile.png'">
    <h2 th:text="${user.username}"></h2>
    <p th:text="${user.bio}"></p>
  </div>

  <h3>Edit Profile</h3>

  <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" th:value="${user.username}" required>
    </div>

    <div class="form-group">
      <label for="bio">Bio:</label>
      <textarea id="bio" name="bio" rows="4" th:text="${user.bio}" required></textarea>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" th:value="${user.email}" required>
    </div>

    <div class="form-group">
      <label for="gender">Gender:</label>
      <select id="gender" name="gender" th:value="${user.gender}" required>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="pronouns">Pronouns:</label>
      <input type="text" id="pronouns" name="pronouns" th:value="${user.pronouns}">
    </div>

    <div class="form-group">
      <label for="address">Address:</label>
      <input type="text" id="address" name="address" th:value="${user.address}">
    </div>

    <div class="form-group">
      <label for="profileImage">Profile Image:</label>
      <input type="file" id="profileImage" name="profileImage" accept="image/*">
      <div class="image-preview">
        <img th:src="${user.profileImagePath}" alt="Profile Image" onerror="this.style.display='none'">
      </div>
    </div>

    <button type="submit" class="btn btn-primary full-width">Update Profile</button>
  </form>

  <a href="/dashboard" class="btn btn-secondary">Cancel</a>
</div>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(#5742df);
    color: #ffffff;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    background-color: #1e293b;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    max-width: 600px;
    width: 90%;
    margin: auto;
  }
  .profile-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .profile-image {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .form-group {
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
  }
  label {
    font-weight: bold;
    margin-bottom: 5px;
  }
  input[type="text"], input[type="email"], textarea, select {
    padding: 10px;
    border: none;
    border-radius: 8px;
    background-color: #334155;
    color: #ffffff;
  }
  input[type="text"]:focus, input[type="email"]:focus, textarea:focus, select:focus {
    outline: none;
    box-shadow: 0 0 10px #38bdf8;
  }
  .image-preview img {
    max-width: 150px;
    margin-top: 10px;
    border-radius: 8px;
  }
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.3s;
    margin-top: 10px;
  }
  .btn-primary {
    background-color: #38bdf8;
    color: #0f172a;
  }
  .btn-primary:hover {
    background-color: #0ea5e9;
  }
  .btn-secondary {
    background-color: #64748b;
    color: #ffffff;
  }
  .btn-secondary:hover {
    background-color: #475569;
  }
  .full-width {
    width: 100%;
  }
  @media (max-width: 768px) {
    .container {
      padding: 20px;
    }
    .profile-image {
      width: 100px;
      height: 100px;
    }
    .btn {
      width: 100%;
    }
  }
</style>

</body>
</html>
