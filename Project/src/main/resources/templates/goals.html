<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Goals Tracker</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
  <h1>Goals Tracker</h1>
</header>

<section>
  <h2>Active Goals</h2>
  <button onclick="window.location.href='/goals/addGoal'">+ Add New Goal</button>
  <ul>
    <li th:each="goal : ${activeGoals}">
      <span th:text="${goal.title}"></span>
      (Expires at: <span th:text="${goal.expiresAt}"></span>)
      <button th:onclick="|window.location.href='/goals/edit/' + ${goal.id}|">Edit</button>

      <!-- Complete Goal Button using Form -->
      <form th:action="@{/goals/{id}/complete(id=${goal.id})}" method="POST" style="display:inline;">
        <button type="submit">Complete</button>
      </form>

      <!-- Delete Goal Button -->
      <form th:action="@{/goals/{id}/delete(id=${goal.id})}" method="POST" style="display:inline;">
        <input type="hidden" name="_method" value="DELETE" />
        <button type="submit">Delete</button>
      </form>
    </li>
  </ul>
</section>

<section>
  <h2>Expired Goals</h2>
  <ul>
    <li th:each="goal : ${expiredGoals}">
      <span th:text="${goal.title}"></span> (Expired on: <span th:text="${goal.expiresAt}"></span>)

      <!-- Delete Expired Goal Button -->
      <form th:action="@{/goals/{id}/delete(id=${goal.id})}" method="POST" style="display:inline;">
        <input type="hidden" name="_method" value="DELETE" />
        <button type="submit">Delete</button>
      </form>
    </li>
  </ul>
</section>

<section>
  <h2>Completed Goals</h2>
  <ul>
    <li th:each="goal : ${completedGoals}">
      <span th:text="${goal.title}"></span> (Completed on: <span th:text="${goal.completedAt}"></span>)

      <!-- Delete Completed Goal Button -->
      <form th:action="@{/goals/{id}/delete(id=${goal.id})}" method="POST" style="display:inline;">
        <input type="hidden" name="_method" value="DELETE" />
        <button type="submit">Delete</button>
      </form>
    </li>
  </ul>
</section>

<script>
  function deleteGoal(goalId) {
    fetch(`/goals/${goalId}/delete`, { method: 'DELETE' })
            .then(() => location.reload());
  }
</script>
</body>
</html>
