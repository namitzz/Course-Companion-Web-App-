<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Goals Tracker</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container">
  <h1>Goals Tracker</h1>

  <!-- Active Goals Section -->
  <section>
    <h2>Active Goals</h2>
    <button onclick="window.location.href='/goals/addGoal'">+ Add New Goal</button>
    <ul>
      <li th:each="goal : ${activeGoals}">
        <span th:text="${goal.title}"></span>
        <span th:inline="text">(Expires [[${#temporals.format(goal.expiresAt, 'MMM dd, yyyy HH:mm')}]])</span>


        <button th:onclick="|window.location.href='/goals/edit/' + ${goal.id}|">Edit</button>

        <form th:action="@{/goals/{id}/complete(id=${goal.id})}" method="POST">
          <button type="submit">Complete</button>
        </form>

        <form th:action="@{/goals/{id}/delete(id=${goal.id})}" method="POST">
          <input type="hidden" name="_method" value="DELETE" />
          <button type="submit" class="delete-btn">Delete</button>
        </form>
      </li>
    </ul>
  </section>

  <!-- Expired Goals Section -->
  <section>
    <h2>Expired Goals</h2>
    <ul>
      <li th:each="goal : ${expiredGoals}">
        <span th:text="${goal.title}"></span>
        <span th:inline="text">(Expired [[${#temporals.format(goal.expiresAt, 'MMM dd, yyyy HH:mm')}]])</span>

        <form th:action="@{/goals/{id}/delete(id=${goal.id})}" method="POST">
          <input type="hidden" name="_method" value="DELETE" />
          <button type="submit" class="delete-btn">Delete</button>
        </form>
      </li>
    </ul>
  </section>

  <!-- Completed Goals Section -->
  <section>
    <h2>Completed Goals</h2>
    <ul>
      <li th:each="goal : ${completedGoals}">
        <span th:text="${goal.title}"></span>(Completed [[${#temporals.format(goal.completedAt, 'MMM dd, yyyy HH:mm')}]])

        <form th:action="@{/goals/{id}/delete(id=${goal.id})}" method="POST">
          <input type="hidden" name="_method" value="DELETE" />
          <button type="submit" class="delete-btn">Delete</button>
        </form>
      </li>
    </ul>
  </section>
</div>

<script>
  function deleteGoal(goalId) {
    fetch(`/goals/${goalId}/delete`, { method: 'DELETE' })
            .then(() => location.reload());
  }
</script>

</body>
</html>
