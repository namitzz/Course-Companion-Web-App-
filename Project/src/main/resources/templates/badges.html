<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Badges</title>
    <!-- Include Bootstrap CSS for modal (optional) -->
    <link rel="stylesheet" th:href="@{/static/css/styles.css}">
    <style>
        /* Custom CSS for the popup */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>
<body>
<h1>Welcome, <span th:text="${user.username}"></span>!</h1>

<h2>Your Badges</h2>
<ul>
    <li th:each="badge : ${badges}" th:text="${badge.name}"></li>
</ul>

<h2>Completed Courses</h2>
<ul>
    <li th:each="course : ${completedCourses}" th:text="${course.course.title}"></li>
</ul>

<h2>Complete a Course</h2>
<form action="/complete-course" method="post">
    <input type="hidden" name="userId" th:value="${user.id}">
    <label for="courseId">Course ID:</label>
    <input type="text" id="courseId" name="courseId" required>
    <button type="submit">Complete Course</button>
</form>

<!-- Popup for error messages -->
<div id="errorPopup" class="popup">
    <p id="errorMessage"></p>
    <button onclick="closePopup()">Close</button>
</div>
<div id="overlay" class="overlay"></div>

<!-- Include Bootstrap JS for modal (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Function to display the error popup
    function showPopup(message) {
        document.getElementById("errorMessage").textContent = message;
        document.getElementById("errorPopup").style.display = "block";
        document.getElementById("overlay").style.display = "block";
    }

    // Function to close the popup
    function closePopup() {
        document.getElementById("errorPopup").style.display = "none";
        document.getElementById("overlay").style.display = "none";
    }

    // Check if there's an error message and display it as a popup
    window.onload = function() {
        const errorMessage = "[[${error}]]"; // Thymeleaf expression to get the error message
        if (errorMessage) {
            showPopup(errorMessage);
        }
    };
</script>
</body>
</html>
