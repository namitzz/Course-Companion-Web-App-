spring.application.name=Project
spring.datasource.url=jdbc:mysql://localhost:3306/co2123db
# Database username
spring.datasource.username=co2123
# Database password
spring.datasource.password=password
# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
# Show SQL
spring.jpa.show-sql=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.enabled=true

# Spring MVC Configuration for JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.port=8080


# Database Configuration (H2 In-Memory)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver

# Hibernate (JPA) Properties
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (Web UI)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Spring Security Default User
spring.security.userInfo.name=admin
spring.security.userInfo.password=admin123

# Logging Level
logging.level.org.springframework=INFO

# Static Resources
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/,file:src/main/webapp/static/