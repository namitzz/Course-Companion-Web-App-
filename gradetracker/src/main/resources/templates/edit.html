<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Course</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="container">
    <h1>Edit Course</h1>

    <form th:action="@{/courses/update}" method="post" class="form-container">
        <input type="hidden" name="id" th:value="${courseTracker.id}">

        <label for="name">Course Name:</label>
        <input type="text" id="name" name="name" th:value="${courseTracker.name}" required>

        <label for="weight">Weight (%):</label>
        <input type="number" id="weight" name="weight" min="1" max="100" th:value="${courseTracker.weight}" required>

        <button type="submit" class="btn update">Update Course</button>
    </form>

    <a href="/courses" class="btn home">Back to Courses</a>
</div>

</body>
</html>
