<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Courses</title>
    
</head>
<body>
<!-- HTML content -->
<h2>Course Search</h2>


<!-- Search form -->
<form action="/search" method="get">
    <input type="text" name="keyword" placeholder="Enter keyword..." required>
    <select name="category">
        <option value="">All Categories</option>
        <option value="Programming">Programming</option>
        <option value="Backend">Backend</option>
        <option value="Frontend">Frontend</option>
        <option value="Data Science">Data Science</option>
        <option value="Security">Security</option>
    </select>
    <!-- Submit button -->
    <button type="submit">Search</button>
</form>


<!-- Results -->
<h3>Results:</h3>

<ul>
    <li th:each="course : ${results}">
        <strong th:text="${course.name}"></strong> -
        <span th:text="${course.category}"></span>
        <p th:text="${course.description}"></p>
    </li>
</ul>



<p th:if="${#lists.isEmpty(results)}">No courses found.</p>

</body>
</html>
